[project]
name = "datamining-app"
version = "1.0.0"
description = "Desktop demo application for educational data-mining algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "networkx>=3.2.1",
]

[project.scripts]
datamining-app = "datamining_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamining_app"]

[tool.hatch.build.targets.wheel.force-include]
"locale" = "datamining_app/locale"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
